apiVersion: v1
kind: ConfigMap
metadata:
  name: document-retrieval-envoy
  namespace: crosslayer-workloads
  labels:
    project: crosslayer
    component: telemetry
data:
  envoy.yaml: |
    admin:
      access_log_path: /dev/null
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: service_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    route_config:
                      name: service_routes
                      virtual_hosts:
                        - name: document_retrieval
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: document_retrieval_app
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: document_retrieval_app
          type: STRICT_DNS
          connect_timeout: 2s
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: document_retrieval_app
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: document-retrieval-upstream.crosslayer-workloads.svc.cluster.local.
                          port_value: 8080
---
