apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crosslayer-envoy
  namespace: observability
  labels:
    release: kube-prom-stack
    project: crosslayer
spec:
  namespaceSelector:
    matchNames:
      - crosslayer-workloads
  selector:
    matchLabels:
      telemetry: envoy
  targetLabels:
    - envoy_service
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
      scrapeTimeout: 5s
