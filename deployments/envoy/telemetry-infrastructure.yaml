apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-retrieval-envoy
  namespace: crosslayer-workloads
  labels:
    app: crosslayer-envoy
    envoy_service: document-retrieval
    project: crosslayer
    component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crosslayer-envoy
      envoy_service: document-retrieval
  template:
    metadata:
      labels:
        app: crosslayer-envoy
        envoy_service: document-retrieval
        project: crosslayer
        component: proxy
      annotations:
        crosslayer.io/config-version: "2"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: crosslayer-envoy
              envoy_service: document-retrieval
      containers:
        - name: envoy
          image: localhost:32000/crosslayer/envoy@sha256:49d3e8b6246d1a804acffaebe42f2799edc77b77a37a97709ef742af90b6d223
          imagePullPolicy: IfNotPresent
          command: ["envoy"]
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--service-cluster"
            - "document-retrieval"
            - "--service-node"
            - "$(POD_NAME)"
            - "--disable-hot-restart"
            - "--log-level"
            - "info"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9901
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /ready
              port: 9901
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            periodSeconds: 10
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: envoy-config
          configMap:
            name: document-retrieval-envoy
        - name: tmp
          emptyDir: {}
---
